[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redux-media-library"
version = "0.10.7"
description = "Independent local media library for standard PC drives and removable storage"
requires-python = ">=3.11"
dependencies = ["Pillow==13.0.0"]

[project.scripts]
redux-library = "redux.__main__:main"

[tool.setuptools.packages.find]
include = ["redux*"]
